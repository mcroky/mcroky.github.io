name: Deploy Nagalttae Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nagalttae-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nagalttae/push-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nagalttae-web-push
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nagalttae/push-server/package-lock.json
      - run: npm ci
      - run: node --test test-arrivals.mjs test-tago.mjs test-seoul.mjs test-rail-arrivals.mjs
      - name: Deploy Worker with repository secret
        env:
          TAGO_SERVICE_KEY: ${{ secrets.TAGO_SERVICE_KEY }}
          SEOUL_SUBWAY_SERVICE_KEY: ${{ secrets.SEOUL_SUBWAY_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          : "${TAGO_SERVICE_KEY:?Set the TAGO_SERVICE_KEY repository secret}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CF_WORKER_DEPLOY_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          secrets_file="$(mktemp "$RUNNER_TEMP/nagalttae-secrets.XXXXXX")"
          trap 'rm -f -- "$secrets_file"' EXIT
          node -e 'const { TAGO_SERVICE_KEY, SEOUL_SUBWAY_SERVICE_KEY } = process.env; require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ TAGO_SERVICE_KEY, ...(SEOUL_SUBWAY_SERVICE_KEY && { SEOUL_SUBWAY_SERVICE_KEY }) }))' "$secrets_file"
          npm run deploy -- --secrets-file "$secrets_file"
